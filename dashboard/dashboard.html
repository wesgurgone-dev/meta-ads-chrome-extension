<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meta Ads Library Saver</title>
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <aside id="sidebar">
      <div class="brand">
        <span class="brand-mark"
          ><svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
            <rect
              x="1"
              y="7"
              width="8.5"
              height="10"
              rx="2"
              fill="currentColor"
              opacity=".26"
            />
            <rect
              x="6"
              y="5"
              width="9.5"
              height="14"
              rx="2.2"
              fill="currentColor"
              opacity=".5"
            />
            <rect
              x="12"
              y="3"
              width="11"
              height="18"
              rx="2.6"
              fill="currentColor"
            /></svg
        ></span>
        <div class="brand-text">
          <div class="brand-name">Ads Saver</div>
          <div class="brand-sub">Meta Ad Library</div>
        </div>
      </div>

      <div class="space-switch">
        <label class="field-label" for="space-select">Space</label>
        <select id="space-select"></select>
        <div id="space-meta" class="space-meta"></div>
        <div class="space-actions">
          <button id="btn-new-space" class="btn btn-ghost tiny" type="button">
            New
          </button>
          <button id="btn-team" class="btn btn-ghost tiny" type="button">
            Team
          </button>
        </div>
      </div>

      <nav id="nav-lists">
        <button class="nav-item active" data-list="__all__" type="button">
          <span class="nav-dot all-dot"></span>
          <span class="nav-name">All ads</span>
          <span class="nav-count" id="count-all">0</span>
        </button>
        <div id="user-lists"></div>
      </nav>

      <button id="btn-new-list" class="btn btn-ghost" type="button">
        + New list
      </button>

      <button id="btn-library" class="btn btn-ghost" type="button">
        Go to Ad Library
      </button>

      <div class="sidebar-footer">
        <button id="btn-export-json" class="btn btn-ghost tiny" type="button">
          JSON
        </button>
        <button id="btn-export-csv" class="btn btn-ghost tiny" type="button">
          CSV
        </button>
        <button id="btn-settings" class="btn btn-ghost tiny" type="button">
          Settings
        </button>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <input
          id="search"
          type="search"
          placeholder="Search advertiser, copy, CTA, link..."
        />
        <select id="filter-format">
          <option value="">All formats</option>
          <option value="video">Video</option>
          <option value="image">Image</option>
          <option value="carousel">Carousel</option>
        </select>
        <select id="filter-status">
          <option value="">Any status</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
        <select id="sort">
          <option value="saved">Recently saved</option>
          <option value="running">Longest running</option>
          <option value="started">Newest ads</option>
          <option value="advertiser">Advertiser A-Z</option>
        </select>
      </header>

      <section id="stats" class="stats"></section>

      <section id="metrics" class="metrics">
        <div class="metrics-head">
          <h2>Metrics</h2>
          <button id="metrics-toggle" class="btn btn-ghost tiny" type="button">
            Hide
          </button>
        </div>
        <div id="metrics-body" class="metrics-body"></div>
      </section>

      <section id="bulkbar" class="bulkbar hidden">
        <span id="bulk-count">0 selected</span>
        <select id="bulk-list-target"></select>
        <button id="bulk-add" class="btn btn-primary small" type="button">
          Add to list
        </button>
        <button id="bulk-download" class="btn btn-green small" type="button">
          Download
        </button>
        <button id="bulk-remove" class="btn btn-danger small" type="button">
          Remove
        </button>
        <button id="bulk-clear" class="btn btn-ghost small" type="button">
          Clear
        </button>
      </section>

      <section id="grid" class="grid"></section>
      <div id="empty" class="empty hidden">
        <div class="empty-mark">
          <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
            <defs>
              <linearGradient id="malMarkB" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#2a78d6" />
                <stop offset="1" stop-color="#8b5cf6" />
              </linearGradient>
            </defs>
            <rect
              x="1"
              y="7"
              width="8.5"
              height="10"
              rx="2"
              fill="url(#malMarkB)"
              opacity=".26"
            />
            <rect
              x="6"
              y="5"
              width="9.5"
              height="14"
              rx="2.2"
              fill="url(#malMarkB)"
              opacity=".5"
            />
            <rect
              x="12"
              y="3"
              width="11"
              height="18"
              rx="2.6"
              fill="url(#malMarkB)"
            />
          </svg>
        </div>
        <h2>No ads here yet</h2>
        <p>
          Browse the
          <a
            href="https://www.facebook.com/ads/library/"
            target="_blank"
            rel="noreferrer"
            >Meta Ad Library</a
          >, scroll the results, then hit <strong>Save</strong> on any ad. Use
          the caret beside Save to drop it straight into a list.
        </p>
      </div>
    </main>

    <div id="modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-card" id="modal-card"></div>
    </div>

    <input
      type="file"
      id="import-file"
      accept="application/json,.json"
      hidden
    />

    <script src="metrics.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
